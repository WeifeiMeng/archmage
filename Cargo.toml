[workspace]
members = ["crates/archmage-core", "crates/archmage-cli", "apps/archmage-desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "fs", "net", "sync"] }
tempfile = "3"
directories = "6"
agent-client-protocol = { version = "5.1.0", features = ["process", "stdio"] }
